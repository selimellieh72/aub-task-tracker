<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Task Tracker</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="app-header">
    <div>
      <h1>Task Tracker</h1>
      <p class="subtitle">Kanban board backed by the FastAPI Task Tracker API</p>
    </div>
    <button type="button" class="button button-primary" id="new-task-button">New task</button>
  </header>

  <!-- Status banner: loading / empty / error messages will render here later -->
  <p class="status-banner" id="status-banner" hidden></p>

  <!-- Board filters. Every control here maps to a GET /tasks query param;
       filtering is backend-driven, so changing one refetches the board. -->
  <section class="filters" id="filters" aria-label="Board filters">
    <label><input type="checkbox" id="filter-overdue" /> Overdue only</label>
    <label>Tag
      <!-- Options are filled in by refreshTagFilter() from the tags seen so far. -->
      <select id="filter-tag">
        <option value="">All tags</option>
      </select>
    </label>
  </section>

  <!--
    Board layout. Each column's data-status matches the API enum exactly
    (ToDo / InProgress / Done); the <h2> is the human label.
    Cards are <li> elements so JS can later clear a column's <ul> and
    re-append one <li class="card"> per task using the same structure.
  -->
  <main class="board" id="board">

    <section class="column" data-status="ToDo">
      <h2 class="column-title">To Do <span class="column-count">0</span></h2>
      <ul class="cards"></ul>
    </section>

    <section class="column" data-status="InProgress">
      <h2 class="column-title">In Progress <span class="column-count">0</span></h2>
      <ul class="cards"></ul>
    </section>

    <section class="column" data-status="Done">
      <h2 class="column-title">Done <span class="column-count">0</span></h2>
      <ul class="cards"></ul>
    </section>

  </main>

  <!-- Create / edit modal. Native <dialog>: Escape closes it for free. -->
  <dialog class="task-dialog" id="task-dialog">
    <form class="task-form" id="task-form" method="dialog" novalidate>
      <div class="task-form-header">
        <h2 class="task-form-title" id="task-form-title">New task</h2>
        <button type="button" class="button button-small" id="close-button" aria-label="Close">&#x2715;</button>
      </div>
      <input type="hidden" name="id" />

      <label>Title
        <input type="text" name="title" maxlength="200" required autocomplete="off" />
      </label>
      <label>Description
        <textarea name="description" rows="3" maxlength="2000"></textarea>
      </label>
      <label>Assignee
        <input type="text" name="assignee" maxlength="100" autocomplete="off" />
      </label>
      <label>Priority
        <select name="priority">
          <option value="Low">Low</option>
          <option value="Medium" selected>Medium</option>
          <option value="High">High</option>
        </select>
      </label>
      <label>Due date
        <input type="date" name="due_date" id="due_date" />
      </label>
      <label>Tags
        <input type="text" name="tags" id="tags" placeholder="bug, backend (comma separated)" autocomplete="off" />
      </label>
      <label class="edit-only">Status
        <select name="status">
          <option value="ToDo">To Do</option>
          <option value="InProgress">In Progress</option>
          <option value="Done">Done</option>
        </select>
      </label>

      <p class="form-error" id="form-error" hidden></p>

      <div class="task-form-actions">
        <button type="button" class="button" id="cancel-button">Cancel</button>
        <button type="submit" class="button button-primary" id="save-button">Save</button>
      </div>
    </form>
  </dialog>

  <script src="app.js"></script>
</body>
</html>
